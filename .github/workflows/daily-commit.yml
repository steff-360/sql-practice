name: Daily Commit
on:
  schedule:
    - cron: '55 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate daily content
        run: python3 .github/scripts/daily_generate.py

      - name: Commit and push
        id: git_commit
        run: |
          git config user.name "steff-360"
          git config user.email "steff.18random@gmail.com"
          git add .
          if git diff --staged --quiet; then
            echo "committed=false" >> $GITHUB_OUTPUT
            echo "No hay cambios nuevos hoy."
          else
            git commit -m "feat: daily practice - $(date +%Y-%m-%d)"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
            echo "Commit realizado exitosamente."
          fi

      - name: Phone notification
        if: success() && steps.git_commit.outputs.committed == 'true'
        run: |
          DATE=$(date +%Y-%m-%d)
          REPO="$GITHUB_REPOSITORY"
          REPO_NAME="sql-practice"
          curl --retry 3 --retry-delay 2 -s \
            -H "Title: ✅ Commit subido: $REPO_NAME" \
            -H "Priority: urgent" \
            -H "Tags: white_check_mark,octocat" \
            -H "Click: https://github.com/$REPO" \
            -d "Se subio exitosamente el commit diario para $REPO_NAME ($DATE)" \
            "https://ntfy.sh/steff360-daily-dev"